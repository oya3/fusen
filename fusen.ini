; ==============================================================================
; fusen (デスクトップ付箋) 設定ファイル
; ==============================================================================
; このファイルは fusen.exe と同じフォルダに配置して読み込みます。
; 値を変更した後は、アプリを再起動すると反映されます。

[Note]
; 新規作成時の付箋のデフォルト幅（ピクセル単位、最小 200）
Width = 280

; 新規作成時の付箋のデフォルト高さ（ピクセル単位、最小 120）
Height = 300

; 新規作成時のデフォルトテーマカラー
; 利用可能な標準テーマ: Yellow, Green, Blue, Pink, Purple, Dark, Custom
ColorTheme = Yellow

; 付箋ウィンドウ全体の不透明度 (0.10 〜 1.00、または 10 〜 100 %)
; 例: 0.85 または 85 に設定すると、付箋全体が 85% の半透明になります。
Opacity = 0.85

; 新規作成時に最前面に固定（ピン留め）するかどうか (true / false)
Pinned = false

; 本文のフォントサイズ (標準: 13.5)
FontSize = 13.5

; 本文のフォントファミリー (省略時はシステムの既定フォント)
FontFamily = Segoe UI, Yu Gothic UI, Meiryo

; ------------------------------------------------------------------------------
; [Backup] 世代バックアップ設定
; data/notes.json のコピーを data/backups/ に世代保存します。
; 万一 notes.json が破損しても、起動時に最新の正常な世代から自動復旧します。
; バックアップは「起動時」「終了時」「稼働中は IntervalMinutes ごと」に作成され、
; 内容に変化がない場合は世代を消費しません。
; ------------------------------------------------------------------------------
[Backup]
; 世代バックアップを有効にするかどうか (true / false)
Enabled = true

; 保持する世代数 (1 〜 100)。超過した古い世代から自動削除されます。
Generations = 5

; 稼働中にバックアップを作成する間隔（分, 1 〜 1440）
; 起動時・終了時には、この間隔に関わらず必ず 1 世代作成されます。
IntervalMinutes = 10

; ------------------------------------------------------------------------------
; [Bash] bash (GNU Readline / Emacs スタイル) キーバインド
; 付箋の本文編集で以下のキー操作が使えます。既定で有効です。
; 不要な場合は Enabled = false にしてください。
;
;   Ctrl+A / Ctrl+E   行頭 / 行末へ移動
;   Ctrl+F / Ctrl+B   1文字 進む / 戻る
;   Alt+F  / Alt+B    1単語 進む / 戻る
;   Ctrl+P / Ctrl+N   1行 上 / 下へ移動
;   Ctrl+@ / Ctrl+Space  範囲選択の開始（マークをセット）
;   Ctrl+W            選択範囲をカット（非選択時は直前の1単語を削除）
;   Alt+W             選択範囲をコピー（非選択時は何もしません）
;   Ctrl+K            カーソルから行末まで削除（行末では改行を削除して次行を連結）
;   Ctrl+U            カーソルから行頭まで削除
;   Alt+D             直後の1単語を削除
;   Ctrl+Y            直前にキルしたテキストを貼り付け（ヤンク）
;   Ctrl+D / Ctrl+H   1文字削除（Delete / Backspace）
;   Ctrl+T            前後の文字を入れ替え
;   Ctrl+_ / Ctrl+/ / Ctrl+Z   元に戻す（アンドゥ）
;   Ctrl+S / Ctrl+R   インクリメンタル検索（前方 / 後方）
;   Ctrl+G / ESC      マーク・選択のキャンセル、検索の中断
;
; 検索中 (Ctrl+S / Ctrl+R) のキー操作:
;   文字入力          検索文字列に追加
;   Backspace         検索文字列を1文字削る
;   Ctrl+S / Ctrl+R   次 / 前の候補へ
;   Ctrl+W            カーソル位置の単語を検索文字列に取り込む
;   Ctrl+Y            直前にキルしたテキストを検索文字列に取り込む
;   Enter             確定（その位置にカーソルを置く）
;   Ctrl+G / ESC      中断（検索を始めた位置へ戻る）
;
; 【注意】
; - 有効な間は Ctrl+N が「1行下へ移動」となり、新規付箋作成には使えません。
;   新規作成は Alt+N、付箋の ＋ ボタン、またはトレイアイコンから行ってください。
; - Ctrl+B / Ctrl+E / Ctrl+U による太字・中央揃え・下線も使えません。
; - キル操作（Ctrl+W / Ctrl+K / Ctrl+U / Alt+D）とコピー（Alt+W）の内容は
;   システムのクリップボードにも反映されます。
; - Ctrl+Space は日本語IMEに横取りされる環境があります。その場合は Ctrl+@ を使ってください。
; ------------------------------------------------------------------------------
[Bash]
; bash キーバインドを有効にするかどうか (true / false)
Enabled = true

; ------------------------------------------------------------------------------
; [CustomTheme] カスタムカラー設定
; ColorTheme = Custom を指定した際、または独自の色を定義したい場合に使用します。
; 
; 【半透明（透過）の指定について】
; 色は #RRGGBB（通常）または #AARRGGBB（半透明: 先頭2桁AAがアルファ透過度）で指定できます。
; 例:
;   #D9FFFDE7 : 約85% 不透明のイエロー（背景が透けてデスクトップが見えます）
;   #80000000 : 50% 半透明のブラック
;   #B3E8F5E9 : 70% 半透明のミントグリーン
; ------------------------------------------------------------------------------
[CustomTheme]
; カスタムテーマの表示名（カラーパレットのツールチップに表示されます）
DisplayName = カスタム

; 付箋の背景色 (#RRGGBB または #AARRGGBB)
Background = #FFFDE7

; ヘッダー（上部タイトルバー）の背景色
Header = #FFF59D

; 枠線の色
Border = #FFF176

; 本文の文字色
Foreground = #212121

; ヘッダーの文字色
HeaderForeground = #3E2723

; ------------------------------------------------------------------------------
; 既存テーマの個別カスタマイズ（任意）
; 各テーマの背景色に半透明 (#AARRGGBB) を指定することも可能です。
; ------------------------------------------------------------------------------
; [Theme.Yellow]
; Background = #E6FFFDE7
; Header = #F2FFF59D
;
; [Theme.Dark]
; Background = #D92B2D30
; Header = #E61E1F22
